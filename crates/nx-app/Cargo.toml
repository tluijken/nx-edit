[package]
name = "nx-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nx-edit"
path = "src/main.rs"

[dependencies]
nx-hlx = { path = "../nx-hlx" }
nx-catalog = { path = "../nx-catalog" }
eframe = "0.37"
egui = "0.37"
serde_json.workspace = true
nx-proto = { path = "../nx-proto" }
nx-capture = { path = "../nx-capture" }
rmpv = "1"
nx-session = { path = "../nx-session" }
nx-usb = { path = "../nx-usb" }
nx-customtone = { path = "../nx-customtone" }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
nx-session = { path = "../nx-session", features = ["fake"] }
