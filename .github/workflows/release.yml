name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low enough for most current distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: nx-edit }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: nx-edit.exe }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64, exe: nx-edit }
          - { os: macos-14, target: x86_64-apple-darwin, name: macos-x86_64, exe: nx-edit }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p nx-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=nx-edit-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} LICENSE README.md "$dir"/
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "nx-edit ${{ github.ref_name }}" --generate-notes
