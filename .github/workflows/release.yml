name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low enough for most current distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: nx-edit }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: nx-edit.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: nx-edit }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: nx-edit }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p nx-app --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=nx-edit-${{ github.ref_name }}-${{ matrix.name }}
          mkdir "$dir" dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} LICENSE README.md "$dir"/
          if [ "${{ matrix.os }}" = ubuntu-22.04 ]; then
            cp packaging/70-nx-edit.rules packaging/io.github.tluijken.NxEdit.desktop \
              packaging/io.github.tluijken.NxEdit.metainfo.xml "$dir"/
            cp assets/nx-edit.svg "$dir"/io.github.tluijken.NxEdit.svg
          fi
          if [ "${{ matrix.os }}" = windows-latest ]; then
            7z a "dist/$dir.zip" "$dir" > /dev/null
          else
            tar czf "dist/$dir.tar.gz" "$dir"
          fi
      - uses: taiki-e/install-action@v2
        if: matrix.os == 'ubuntu-22.04'
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          strip target/${{ matrix.target }}/release/nx-edit
          cargo deb -p nx-app --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm -p crates/nx-app --target ${{ matrix.target }} --output dist/
      - name: Vendored sources
        if: matrix.os == 'ubuntu-22.04'
        run: |
          version=${GITHUB_REF_NAME#v}
          cargo vendor --locked vendor > /dev/null
          tar cJf "dist/nx-edit-$version-vendor.tar.xz" vendor
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --title "nx-edit ${{ github.ref_name }}" --generate-notes
